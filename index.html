<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lock Screen</title>
<style>
  :root{
    --radius-widget: 22px;
    --widget-bg: rgba(255,255,255,0.16);
    --widget-bg-2: rgba(255,255,255,0.10);
    --widget-border: rgba(255,255,255,0.28);
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.82);
    --text-tertiary: rgba(255,255,255,0.55);
    --shadow-soft: 0 10px 34px rgba(0,0,0,0.28);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }

  body{ background:#000; }

  #wallpaper{
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 18% 22%, #ff9d76 0%, transparent 42%),
      radial-gradient(circle at 84% 12%, #7fa3e8 0%, transparent 46%),
      radial-gradient(circle at 50% 96%, #2c1257 0%, transparent 62%),
      linear-gradient(160deg, #171735 0%, #16213e 55%, #0f2f52 100%);
    background-size: cover;
    background-position: center;
    transition: background-image .5s ease;
  }

  #wallpaper::after{
    /* gentle vignette so light wallpapers still keep white text legible */
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 68%, rgba(0,0,0,0.35) 100%);
    pointer-events:none;
  }

  .lock-screen{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    color:var(--text-primary);
    cursor: pointer;
  }

  /* ---------- Time / Date ---------- */
  .clock-block{
    margin-top: clamp(28px, 9vh, 96px);
    display:flex; flex-direction:column; align-items:center;
    text-shadow: 0 2px 18px rgba(0,0,0,0.28);
    pointer-events:none;
  }

  .date{
    font-size: clamp(15px, 2.1vw, 19px);
    font-weight: 600;
    letter-spacing: 0.2px;
    color: var(--text-primary);
    margin-bottom: 2px;
  }

  .time{
    font-size: clamp(76px, 19vw, 148px);
    font-weight: 200;
    line-height: 0.95;
    letter-spacing: -3px;
    transform: scaleY(1.05);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .time .ampm{
    font-size: 0.28em;
    font-weight: 500;
    letter-spacing: 0;
    margin-left: 6px;
    vertical-align: 22%;
    opacity: 0.9;
  }

  /* ---------- Widget stack (left side) ---------- */
  .widget-stack{
    margin-top: clamp(18px, 3.4vh, 34px);
    padding-left: clamp(16px, 5vw, 26px);
    display:flex; flex-direction:column;
    align-items:flex-start;
    gap: 12px;
    pointer-events:none;
  }

  .widget{
    pointer-events:auto;
    background: var(--widget-bg);
    border: 1px solid var(--widget-border);
    border-radius: var(--radius-widget);
    -webkit-backdrop-filter: blur(28px) saturate(1.5);
    backdrop-filter: blur(28px) saturate(1.5);
    box-shadow: var(--shadow-soft);
    color: var(--text-primary);
  }

  /* ---- Flip clock widget ---- */
  .widget-flip{
    padding: 14px 16px;
    display:flex; align-items:center; gap:10px;
  }

  .flip-row{ display:flex; align-items:center; gap:4px; }

  .flip-colon{
    font-size: 22px;
    font-weight: 600;
    color: var(--text-secondary);
    padding-bottom: 2px;
  }

  .digit-cell{
    position:relative;
    width: 22px;
    height: 34px;
    border-radius: 6px;
    perspective: 200px;
    background: rgba(0,0,0,0.18);
  }

  .digit-cell .half{
    position:absolute; left:0; right:0; height:50%;
    overflow:hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
  }
  .digit-cell .top-half{ top:0; border-radius:6px 6px 0 0; }
  .digit-cell .bottom-half{
    bottom:0; border-radius:0 0 6px 6px;
    background: linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.22));
  }
  .digit-cell .half::before{
    /* seam highlight */
    content:""; position:absolute; left:0; right:0; height:1px;
    background: rgba(0,0,0,0.35);
  }
  .digit-cell .top-half::before{ bottom:0; }
  .digit-cell .bottom-half::before{ top:0; }

  .digit-cell .glyph{
    position:absolute; left:0; right:0; height:34px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:600; font-variant-numeric: tabular-nums;
    color:#fff;
  }
  .top-half .glyph{ top:0; }
  .bottom-half .glyph{ top:-17px; }

  .digit-cell .flap{
    position:absolute; left:0; right:0; top:0; height:50%;
    overflow:hidden; border-radius:6px 6px 0 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.20), rgba(255,255,255,0.06));
    transform-origin: bottom center;
    backface-visibility:hidden;
    transform: rotateX(0deg);
    z-index:2;
  }
  .digit-cell .flap .glyph{ top:0; }

  @media (prefers-reduced-motion: reduce){
    .digit-cell .flap{ transition:none !important; }
  }

  /* ---- Weather widget ---- */
  .widget-weather{
    width: 155px;
    padding: 14px 16px 15px;
  }

  .weather-top{
    display:flex; align-items:center; justify-content:space-between;
  }

  .weather-icon{ width:26px; height:26px; color:#fff; flex-shrink:0; }
  .weather-icon svg{ width:100%; height:100%; display:block; }

  .weather-desc{
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-secondary);
    text-align:right;
  }

  .weather-temp{
    font-size: 34px;
    font-weight: 300;
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- bottom controls ---------- */
  .bottom-bar{
    margin-top:auto;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding: 0 clamp(20px, 6vw, 34px) clamp(14px, 3vh, 22px);
    pointer-events:none;
  }

  .icon-btn{
    pointer-events:auto;
    width: 46px; height:46px; border-radius:50%;
    background: rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.22);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    cursor:pointer;
  }
  .icon-btn svg{ width:20px; height:20px; }
  .icon-btn:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

  .home-indicator{
    position:fixed; left:50%; bottom:8px; transform:translateX(-50%);
    width:132px; height:5px; border-radius:3px;
    background: rgba(255,255,255,0.85);
    pointer-events:none;
  }

  /* ---------- wallpaper upload trigger ---------- */
  .wallpaper-btn{
    position:fixed; top: clamp(14px,3vh,22px); right: clamp(14px,4vw,22px);
    z-index:5;
  }

  .wallpaper-hint{
    position:fixed; top: clamp(60px,10vh,86px); left:50%; transform:translateX(-50%);
    font-size:12.5px; color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.28);
    padding:7px 13px; border-radius:14px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    pointer-events:none;
    opacity:1;
    transition: opacity 1.2s ease;
    white-space:nowrap;
  }
  .wallpaper-hint.fade{ opacity:0; }

  #wallpaperInput{ display:none; }
</style>
</head>
<body>

  <div id="wallpaper"></div>

  <div class="lock-screen" id="lockScreen">

    <div class="clock-block">
      <div class="date" id="dateLabel">&nbsp;</div>
      <div class="time" id="timeLabel">&nbsp;</div>
    </div>

    <div class="widget-stack">

      <div class="widget widget-flip" id="flipClock" aria-label="Flip clock">
        <div class="flip-row" id="flipDigits"></div>
      </div>

      <div class="widget widget-weather" id="weatherWidget" aria-label="Weather">
        <div class="weather-top">
          <div class="weather-icon" id="weatherIcon"></div>
          <div class="weather-desc" id="weatherDesc">—</div>
        </div>
        <div class="weather-temp" id="weatherTemp">--°</div>
      </div>

    </div>

    <div class="bottom-bar">
      <div class="icon-btn" id="flashlightBtn" title="Flashlight" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2h8l-1.4 5H15v11.5A2.5 2.5 0 0 1 12.5 21 2.5 2.5 0 0 1 10 18.5V7H9.4L8 2Z"/>
          <path d="M9 7h6"/>
        </svg>
      </div>
      <div class="icon-btn" id="cameraBtn" title="Camera" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8.2A1.8 1.8 0 0 1 5.8 6.4h2L9 4.5h6L16.2 6.4h2A1.8 1.8 0 0 1 20 8.2v9A1.8 1.8 0 0 1 18.2 19H5.8A1.8 1.8 0 0 1 4 17.2v-9Z"/>
          <circle cx="12" cy="12.5" r="3.6"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="icon-btn wallpaper-btn" id="wallpaperBtn" title="Change wallpaper" tabindex="0">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="4.5" width="17" height="15" rx="2.2"/>
      <circle cx="9" cy="10" r="1.6"/>
      <path d="M20.5 15.5 15.8 11 6 19"/>
    </svg>
  </div>
  <input type="file" id="wallpaperInput" accept="image/*">

  <div class="wallpaper-hint" id="wallpaperHint">Tap the photo icon to set a wallpaper</div>
  <div class="home-indicator"></div>

<script>
(function(){

  /* ================= Wallpaper upload ================= */
  const wallpaperEl = document.getElementById('wallpaper');
  const wallpaperInput = document.getElementById('wallpaperInput');
  const wallpaperBtn = document.getElementById('wallpaperBtn');
  const lockScreen = document.getElementById('lockScreen');
  const hint = document.getElementById('wallpaperHint');

  function openPicker(){ wallpaperInput.click(); }
  wallpaperBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openPicker(); });
  wallpaperBtn.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openPicker(); } });

  // Tapping anywhere on the empty background also opens the picker (mirrors
  // the "customize wallpaper" gesture), but not when tapping a widget/button.
  lockScreen.addEventListener('click', (e)=>{
    if (e.target.closest('.widget') || e.target.closest('.icon-btn')) return;
    openPicker();
  });

  wallpaperInput.addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      wallpaperEl.style.backgroundImage = `url(${ev.target.result})`;
    };
    reader.readAsDataURL(file);
  });

  setTimeout(()=> hint.classList.add('fade'), 4000);

  /* ================= Main clock + date ================= */
  const timeLabel = document.getElementById('timeLabel');
  const dateLabel = document.getElementById('dateLabel');
  const locale = navigator.language || 'en-US';
  const dateFmt = new Intl.DateTimeFormat(locale, { weekday:'long', month:'long', day:'numeric' });
  const timeFmt = new Intl.DateTimeFormat(locale, { hour:'numeric', minute:'2-digit' });

  function renderMainClock(){
    const now = new Date();
    dateLabel.textContent = dateFmt.format(now);
    let str = timeFmt.format(now);
    const match = str.match(/\s?([AaPp][Mm])$/);
    if (match){
      const base = str.slice(0, match.index);
      timeLabel.innerHTML = `${base}<span class="ampm">${match[1].toUpperCase()}</span>`;
    } else {
      timeLabel.textContent = str;
    }
  }

  /* ================= Flip clock widget ================= */
  const flipDigits = document.getElementById('flipDigits');

  const FORMAT = ['h','h','m','m','s','s']; // 6 digit positions, colons inserted between pairs
  const cells = [];

  function buildDigitCell(){
    const cell = document.createElement('div');
    cell.className = 'digit-cell';
    cell.dataset.value = '0';
    cell.innerHTML = `
      <div class="half top-half"><span class="glyph">0</span></div>
      <div class="half bottom-half"><span class="glyph">0</span></div>
      <div class="flap"><span class="glyph">0</span></div>
    `;
    return cell;
  }

  FORMAT.forEach((unit, i) => {
    const cell = buildDigitCell();
    cells.push(cell);
    flipDigits.appendChild(cell);
    if (i === 1 || i === 3){
      const colon = document.createElement('div');
      colon.className = 'flip-colon';
      colon.textContent = ':';
      flipDigits.appendChild(colon);
    }
  });

  function setDigit(cell, newVal){
    if (cell.dataset.value === newVal) return;
    const oldVal = cell.dataset.value;
    cell.dataset.value = newVal;

    cell.querySelector('.top-half .glyph').textContent = newVal;
    cell.querySelector('.bottom-half .glyph').textContent = newVal;

    const flap = cell.querySelector('.flap');
    flap.querySelector('.glyph').textContent = oldVal;
    flap.style.transition = 'none';
    flap.style.transform = 'rotateX(0deg)';
    flap.style.opacity = '1';
    // force reflow so the transition below actually animates
    void flap.offsetWidth;
    flap.style.transition = 'transform .45s cubic-bezier(.4,0,.2,1), opacity .3s ease .2s';
    requestAnimationFrame(()=>{
      flap.style.transform = 'rotateX(-90deg)';
      flap.style.opacity = '0';
    });
  }

  function renderFlipClock(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    const digits = (hh+mm+ss).split('');
    digits.forEach((d,i)=> setDigit(cells[i], d));
  }

  /* ================= Weather widget ================= */
  const weatherIconEl = document.getElementById('weatherIcon');
  const weatherDescEl = document.getElementById('weatherDesc');
  const weatherTempEl = document.getElementById('weatherTemp');

  const ICONS = {
    sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.3"/><path d="M12 2.6v2.6M12 18.8v2.6M4.1 4.1l1.85 1.85M18.05 18.05l1.85 1.85M2.6 12h2.6M18.8 12h2.6M4.1 19.9l1.85-1.85M18.05 5.95l1.85-1.85"/></svg>`,
    moon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.7A8.6 8.6 0 1 1 9.3 4a6.8 6.8 0 0 0 10.7 10.7z"/></svg>`,
    cloud: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.8 18.2a4 4 0 0 1-.4-8 5.6 5.6 0 0 1 10.7-1.8 4.2 4.2 0 0 1-.4 9.8H6.8Z"/></svg>`,
    cloudSun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7" r="2.6"/><path d="M8 2.6v1.3M8 10.1v1.3M3.6 7h1.3M11.1 7h1.3M4.9 3.9l.9.9M10.2 3.9l-.9.9" stroke-width="1.3"/><path d="M9 20.2a4 4 0 0 1-.4-8 5.6 5.6 0 0 1 10.7-1.6 4.2 4.2 0 0 1-.5 9.6H9Z"/></svg>`,
    cloudMoon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 3.6A4.3 4.3 0 1 0 12.9 8a3.4 3.4 0 0 1-2.7-4.4Z" stroke-width="1.3"/><path d="M9 20.2a4 4 0 0 1-.4-8 5.6 5.6 0 0 1 10.7-1.6 4.2 4.2 0 0 1-.5 9.6H9Z"/></svg>`,
    fog: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 9.5h11M3.5 13h14M5 16.5h13.5M8 20h9"/></svg>`,
    rain: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.8 14.8a4 4 0 0 1-.4-8 5.6 5.6 0 0 1 10.7-1.8 4.2 4.2 0 0 1-.4 9.8H6.8Z"/><path d="M8.5 18.5 7.3 21M12.5 18.5l-1.2 2.5M16.5 18.5l-1.2 2.5"/></svg>`,
    snow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.8 14.5a4 4 0 0 1-.4-8 5.6 5.6 0 0 1 10.7-1.8 4.2 4.2 0 0 1-.4 9.8H6.8Z"/><path d="M9 18v3.2M9 18l-1.4 1M9 18l1.4 1M15 18v3.2M15 18l-1.4 1M15 18l1.4 1"/></svg>`,
    storm: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.8 13.8a4 4 0 0 1-.4-8 5.6 5.6 0 0 1 10.7-1.8 4.2 4.2 0 0 1-.4 9.8H6.8Z"/><path d="M13 14.5 10 19h3l-2 3.5"/></svg>`
  };

  function iconAndDesc(code, isDay){
    if (code === 0) return { icon: isDay ? ICONS.sun : ICONS.moon, desc: isDay ? 'Clear' : 'Clear' };
    if (code === 1) return { icon: isDay ? ICONS.sun : ICONS.moon, desc: 'Mostly Clear' };
    if (code === 2) return { icon: isDay ? ICONS.cloudSun : ICONS.cloudMoon, desc: 'Partly Cloudy' };
    if (code === 3) return { icon: ICONS.cloud, desc: 'Cloudy' };
    if (code === 45 || code === 48) return { icon: ICONS.fog, desc: 'Foggy' };
    if ([51,53,55,56,57].includes(code)) return { icon: ICONS.rain, desc: 'Drizzle' };
    if ([61,63,65,66,67,80,81,82].includes(code)) return { icon: ICONS.rain, desc: 'Rainy' };
    if ([71,73,75,77,85,86].includes(code)) return { icon: ICONS.snow, desc: 'Snowy' };
    if ([95,96,99].includes(code)) return { icon: ICONS.storm, desc: 'Stormy' };
    return { icon: isDay ? ICONS.cloudSun : ICONS.cloudMoon, desc: 'Mild' };
  }

  const useFahrenheit = /^en-US|^en-BS|^en-BZ|^en-KY|^en-LR/.test(locale);

  async function fetchWeather(lat, lon){
    const unit = useFahrenheit ? 'fahrenheit' : 'celsius';
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=${unit}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('weather request failed');
    const data = await res.json();
    const cw = data.current_weather;
    const { icon, desc } = iconAndDesc(cw.weathercode, cw.is_day === 1);
    weatherIconEl.innerHTML = icon;
    weatherDescEl.textContent = desc;
    weatherTempEl.textContent = `${Math.round(cw.temperature)}°`;
  }

  function loadWeather(){
    const fallback = () => fetchWeather(37.335, -122.009).catch(()=>{
      weatherDescEl.textContent = 'Unavailable';
    });

    if (navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        (pos)=> fetchWeather(pos.coords.latitude, pos.coords.longitude).catch(fallback),
        fallback,
        { timeout: 6000 }
      );
    } else {
      fallback();
    }
  }

  /* ================= Ticking ================= */
  renderMainClock();
  renderFlipClock();
  loadWeather();

  setInterval(renderMainClock, 1000);
  setInterval(renderFlipClock, 1000);
  setInterval(loadWeather, 10 * 60 * 1000);

})();
</script>
</body>
</html>
